<style>
  :root {
    --bg: #EEF1F6;
    --panel: #FFFFFF;
    --border: #DDE3EC;
    --ink: #1C2536;
    --muted: #5B6472;
    --accent: #6C4CE0;
    --accent-ink: #4A32A8;
    --accent-soft: rgba(108, 76, 224, 0.10);
    --comment: #146C3A;
    --radius: 14px;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 1px 1px, #DCE1EA 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px;
  }

  .editor {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 24px 48px -24px rgba(28, 37, 54, 0.18);
    overflow: hidden;
    animation: rise 0.5s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #FBFCFD;
  }

  .dots { display: flex; gap: 6px; flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }

  .tabs { display: flex; gap: 4px; font-family: var(--mono); font-size: 13px; overflow-x: auto; }
  .tab {
    padding: 6px 12px;
    border-radius: 8px 8px 0 0;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .tab.is-active { color: var(--ink); background: var(--panel); border-bottom: 2px solid var(--accent); }
  .tab:hover:not(.is-active) { color: var(--ink); }

  .body-wrap { display: flex; }

  .gutter {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    text-align: right;
    padding: 28px 12px;
    background: #FBFCFD;
    border-right: 1px solid var(--border);
    user-select: none;
    flex-shrink: 0;
  }
  .gutter div { line-height: 2.1; }

  .content { padding: 28px 24px 32px; flex: 1; min-width: 0; }

  .comment-heading {
    font-family: var(--mono);
    color: var(--comment);
    font-size: 16px;
    font-weight: 500;
    margin: 4px 0 10px;
  }

  .narrative {
    margin: 0 0 28px;
    line-height: 1.75;
    font-size: 15.5px;
    max-width: 58ch;
  }

  .socials { display: flex; gap: 10px; flex-wrap: wrap; }
  .social {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .social svg { width: 17px; height: 17px; color: var(--accent-ink); flex-shrink: 0; }
  .social:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .social:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 24px 0 0;
  }

  @media (max-width: 560px) {
    .gutter { display: none; }
    .content { padding: 22px 18px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .editor { animation: none; }
    .social { transition: none; }
  }
</style>
</head>
